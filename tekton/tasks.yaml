apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: capstone-flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: flake8
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install flake8==4.0.1
        flake8 service --count --max-complexity=10 --max-line-length=127 --statistics
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: capstone-nose
spec:
  workspaces:
    - name: source
  params:
    - name: args
      type: string
      default: -v --with-spec --with-coverage --cover-package=service --cover-min-percentage=95
    - name: database_uri
      type: string
      description: Optional database URI override; defaults to the PostgreSQL lab service.
      default: ""
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: $(params.database_uri)
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-user
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-password
        - name: DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: postgresql
              key: database-name
      script: |
        #!/bin/bash
        set -e
        if [ -z "$DATABASE_URI" ]; then
          export DATABASE_URI="postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgresql:5432/${DATABASE_NAME}"
        fi
        python -m pip install --upgrade pip wheel
        pip install -qr requirements.txt
        nosetests $(params.args)
