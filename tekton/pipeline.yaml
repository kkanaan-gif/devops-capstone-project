apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
      type: string
      default: https://github.com/kkanaan-gif/devops-capstone-project.git
    - name: branch
      type: string
      default: main
    - name: build-image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/sn-labs-khalidkanaa1/accounts:latest
  tasks:
    - name: clone
      taskRef:
        kind: ClusterTask
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
      workspaces:
        - name: output
          workspace: pipeline-workspace
    - name: lint
      runAfter: [clone]
      taskRef:
        name: capstone-flake8
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: tests
      runAfter: [clone]
      taskRef:
        name: capstone-nose
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: build
      runAfter: [lint, tests]
      taskRef:
        kind: ClusterTask
        name: buildah
      params:
        - name: IMAGE
          value: $(params.build-image)
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: deploy
      runAfter: [build]
      taskRef:
        kind: ClusterTask
        name: openshift-client
      workspaces:
        - name: manifest-dir
          workspace: pipeline-workspace
      params:
        - name: SCRIPT
          value: |
            set -e
            sed -i "s|IMAGE_NAME_HERE|$(params.build-image)|g" deploy/deployment.yaml
            oc apply -f deploy/
            oc rollout status deployment/accounts --timeout=240s
